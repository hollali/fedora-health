[package]
name = "hdd-watch"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Sampler, startup benchmark, systemd service manager and TUI for diagnosing slow Fedora systems on spinning disks"
license = "MIT"

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
ratatui = { version = "0.30.2", optional = true }
crossterm = { version = "0.29.0", optional = true }

[profile.release]
opt-level = 3
